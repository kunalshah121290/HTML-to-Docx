<!DOCTYPE html>
<html>
<head>
    <title>Free HTML to DOCX Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        .upload-box {
            border: 2px dashed #ccc;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            cursor: pointer;
        }

        .upload-box:hover {
            border-color: #667eea;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        .btn:hover {
            background: #5a67d8;
        }

        .note {
            font-size: 12px;
            margin-top: 10px;
            color: #888;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>HTML to DOCX Converter</h1>
    <p>Upload multiple HTML files and download DOCX instantly</p>

    <form action="/convert" method="post" enctype="multipart/form-data" onsubmit="showLoading()">

        <label class="upload-box">
            Click to upload HTML files
            <input type="file" name="files" multiple accept=".html,.htm">
        </label>

        <button class="btn" type="submit">Convert to DOCX</button>

        <div class="loading" id="loadingText">Converting... Please wait ⏳</div>
    </form>

    <p class="note">Supports multiple files | Fast & Free</p>
</div>

<script>
function showLoading() {
    document.getElementById("loadingText").style.display = "block";
}
</script>

</body>
</html>
